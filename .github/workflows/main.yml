on: ["push", "pull_request"]
name: Main Workflow

permissions:
  contents: read

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [ 7.4, 8.0, 8.1, 8.2 ]

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify bundled Adyen Web SDK matches manifest
        run: .github/workflows/scripts/verify-web-sdk.sh

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Disable Composer security block
        run: composer config --global audit.block-insecure false

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHP Code Sniffer
        run: vendor/bin/phpcs .

      - name: Make sure project files are compilable
        run: find -L . -path ./vendor -prune -o -path ./tests -prune -o -name '*.php' -print0 | xargs -0 -n 1 -P 4 php -l

      - name: Run PHPUnit
        run: vendor/bin/phpunit
